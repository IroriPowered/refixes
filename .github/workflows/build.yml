name: Build
on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          java-version: "25"
          distribution: "temurin"
      - name: Fetch the pinned Hyinit release
        run: bash scripts/fetch-hyinit.sh "$RUNNER_TEMP/Hyinit.jar"
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Check formatting and build single JAR
        run: ./gradlew spotlessCheck singleJar -PhyinitJar="$RUNNER_TEMP/Hyinit.jar"
      - name: Capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/bundle/refixes-*.jar

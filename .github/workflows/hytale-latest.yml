name: Newest Hytale
on:
  schedule:
    - cron: "0 20 * * 4"
  workflow_dispatch:
    inputs:
      force:
        description: Verify even when the newest Hytale is the pinned version
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - repository: release
            server-property: hytaleServerJar
          - repository: pre-release
            server-property: hytaleServerJar08
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Resolve pinned and newest Hytale
        id: server
        run: |
          repository=${{ matrix.repository }}
          case "$repository" in
            release) pinned=$(sed -n 's/^hytale *= *"\(.*\)"/\1/p' gradle/libs.versions.toml) ;;
            pre-release) pinned=$(sed -n 's/^hytale-pre *= *"\(.*\)"/\1/p' gradle/libs.versions.toml) ;;
          esac
          base="https://maven.hytale.com/$repository/com/hypixel/hytale/Server"
          newest=$(curl -fsSL "$base/maven-metadata.xml" | sed -n 's:.*<latest>\(.*\)</latest>.*:\1:p')
          test -n "$pinned" && test -n "$newest"
          printf 'base=%s\npinned=%s\nnewest=%s\n' "$base" "$pinned" "$newest" >> "$GITHUB_OUTPUT"
          if [ "$newest" = "$pinned" ] && [ "${{ inputs.force }}" != true ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Hytale $repository $newest is the pinned version, already verified before the push" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Testing Refixes built for Hytale $pinned against the newest $repository, Hytale $newest" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Validate Gradle wrapper
        if: steps.server.outputs.skip != 'true'
        uses: gradle/actions/wrapper-validation@v6
      - name: Setup JDK
        if: steps.server.outputs.skip != 'true'
        uses: actions/setup-java@v6
        with:
          java-version: "25"
          distribution: "temurin"
      - name: Download Hytale ${{ steps.server.outputs.newest }}
        if: steps.server.outputs.skip != 'true'
        run: |
          base=${{ steps.server.outputs.base }}
          newest=${{ steps.server.outputs.newest }}
          curl -fsSL -o "$RUNNER_TEMP/Server-newest.jar" "$base/$newest/Server-$newest.jar"
      - name: Fetch the pinned Hyinit release
        if: steps.server.outputs.skip != 'true'
        run: bash scripts/fetch-hyinit.sh "$RUNNER_TEMP/Hyinit.jar"
      - name: Make Gradle wrapper executable
        if: steps.server.outputs.skip != 'true'
        run: chmod +x ./gradlew
      - name: Build single JAR for Hytale ${{ steps.server.outputs.pinned }}
        id: build
        if: steps.server.outputs.skip != 'true'
        run: ./gradlew singleJar -PhyinitJar="$RUNNER_TEMP/Hyinit.jar" && cp build/bundle/refixes-*.jar "$RUNNER_TEMP/Refixes.jar"
      - name: Patches apply on Hytale ${{ steps.server.outputs.newest }}
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >-
          python3 scripts/verify.py apply --java-home "$JAVA_HOME"
          --server-jar "$RUNNER_TEMP/Server-newest.jar" --hyinit-jar "$RUNNER_TEMP/Hyinit.jar"
          --refixes-jar "$RUNNER_TEMP/Refixes.jar" --output-dir "$RUNNER_TEMP/verify"
      - name: Regressions on Hytale ${{ steps.server.outputs.newest }}
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >-
          python3 scripts/verify.py regressions --java-home "$JAVA_HOME"
          --server-jar "$RUNNER_TEMP/Server-newest.jar" --hyinit-jar "$RUNNER_TEMP/Hyinit.jar"
          --refixes-jar "$RUNNER_TEMP/Refixes.jar" --output-dir "$RUNNER_TEMP/verify"
      - name: Queue limits on Hytale ${{ steps.server.outputs.newest }}
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >-
          python3 scripts/verify.py queue-limits --java-home "$JAVA_HOME"
          --server-jar "$RUNNER_TEMP/Server-newest.jar" --hyinit-jar "$RUNNER_TEMP/Hyinit.jar"
          --refixes-jar "$RUNNER_TEMP/Refixes.jar" --output-dir "$RUNNER_TEMP/verify"
      - name: Compiles against Hytale ${{ steps.server.outputs.newest }}
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: ./gradlew classes v07Classes v08Classes -P${{ matrix.server-property }}="$RUNNER_TEMP/Server-newest.jar"
      - name: Hyinit Mixin check on Hytale ${{ steps.server.outputs.newest }}
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          mkdir -p "$RUNNER_TEMP/check-mixins/earlyplugins"
          cp "$RUNNER_TEMP/Refixes.jar" "$RUNNER_TEMP/check-mixins/earlyplugins/Refixes.jar"
          cd "$RUNNER_TEMP/check-mixins"
          java -jar "$RUNNER_TEMP/Hyinit.jar" --check-mixins --strict --report=report.json --server-jar "$RUNNER_TEMP/Server-newest.jar"
      - name: Capture the Hyinit Mixin check report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Mixin-check-${{ matrix.repository }}-${{ steps.server.outputs.newest }}
          path: ${{ runner.temp }}/check-mixins/report.json
          if-no-files-found: ignore
      - name: Capture verification evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: Verification-${{ matrix.repository }}-${{ steps.server.outputs.newest }}
          path: |
            ${{ runner.temp }}/verify
            !${{ runner.temp }}/verify/**/*.jar
          if-no-files-found: ignore
